[project]
name = "stata-fix"
version = "0.1.4"
description = "MCP server for running local Stata through COM, GUI automation, or pystata"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "mcp>=1.27.1",
    "pywin32>=306; sys_platform == 'win32'",
]
keywords = ["mcp", "stata", "automation", "pystata"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
stata-fix-mcp = "stata_fix.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
